<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elzanın Dəvətnaməsi</title>
    <!-- Google Fonts-dan zərif şriftləri yükləyirik -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <style>
        /* Səhifənin ümumi stili */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            background-color: #fdfaf5; /* Krem rəngli fon */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Dəvətnamə kartının konteyneri */
        .invitation-card {
            background-color: #fff;
            width: 90%;
            max-width: 450px;
            height: 90%;
            max-height: 750px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px;
            text-align: center;
            overflow: hidden;
            border: 2px solid #e0c9a6; /* Qızılı çərçivə */
            box-sizing: border-box;

            /* Animasiyanın başlanğıc halı: görünməz və aşağıda */
            opacity: 0;
            transform: translateY(50px);
            animation: cardAppear 1.5s ease-out forwards;
        }

        /* Kartın görünmə animasiyası */
        @keyframes cardAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Arxa fondakı zərif naxış (şəkildəki sütunlara bənzər) */
        .invitation-card::before {
            content: '';
            position: absolute;
            top: -50px;
            left: -50px;
            right: -50px;
            bottom: -50px;
            background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png'); /* Kağız fakturası */
            opacity: 0.3;
            z-index: -1;
        }

        /* Üst hissədəki qızılı naxış */
        .top-ornament {
            width: 100px;
            height: auto;
            margin-bottom: 10px;
        }

        /* "Dəvətlisiniz" başlığı */
        .title {
            font-family: 'Great Vibes', cursive;
            font-size: 48px;
            color: #b38b5d; /* Tünd qızılı */
            margin: 0 0 20px 0;
            
            /* Başlıq üçün fade-in animasiyası */
            opacity: 0;
            animation: fadeIn 1s ease-in 1s forwards;
        }

        /* Elzanın adı */
        .name {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
            
            opacity: 0;
            animation: fadeIn 1s ease-in 1.5s forwards;
        }

        /* Universitet və ixtisas məlumatı */
        .details {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
            
            opacity: 0;
            animation: fadeIn 1s ease-in 2s forwards;
        }

        /* Tarix bloku */
        .date-box {
            display: flex;
            gap: 15px;
            align-items: center;
            border-top: 1px solid #e0c9a6;
            border-bottom: 1px solid #e0c9a6;
            padding: 15px 0;
            margin-bottom: 20px;
            width: 100%;
            justify-content: center;
            
            opacity: 0;
            animation: fadeIn 1s ease-in 2.5s forwards;
        }

        .day-name {
            font-weight: bold;
            font-size: 18px;
        }

        .day-number {
            font-size: 48px;
            font-weight: 700;
            color: #b38b5d;
            border-left: 1px solid #e0c9a6;
            border-right: 1px solid #e0c9a6;
            padding: 0 15px;
        }

        .month-year {
            font-size: 18px;
        }

        /* Məkan məlumatı */
        .venue {
            font-size: 18px;
            color: #333;
            font-weight: bold;
            margin-bottom: 30px;
            
            opacity: 0;
            animation: fadeIn 1s ease-in 3s forwards;
        }

        /* "Qəbul Et" düyməsi */
        .btn-rsvp {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(45deg, #e0c9a6, #b38b5d);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(179, 139, 93, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            
            opacity: 0;
            animation: fadeIn 1s ease-in 3.5s forwards;
        }

        .btn-rsvp:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(179, 139, 93, 0.6);
        }

        /* Künclərdəki güllər */
        .flower {
            position: absolute;
            width: 120px;
            height: auto;
            opacity: 0.8;
            z-index: 0;
        }

        .flower-top-left {
            top: -20px;
            left: -20px;
            transform: rotate(-15deg);
        }

        .flower-bottom-right {
            bottom: -20px;
            right: -20px;
            transform: rotate(165deg);
        }

        /* Ümumi fade-in animasiyası */
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Mobil cihazlar üçün uyğunlaşdırma */
        @media (max-height: 700px) {
            .invitation-card { padding: 20px; }
            .title { font-size: 36px; }
            .name { font-size: 28px; }
            .day-number { font-size: 36px; }
        }
    </style>
</head>
<body>

    <div class="invitation-card">
        <!-- Künc gülləri (Simvolik şəkillər, real güllər üçün URL-ləri dəyişə bilərsən) -->
        <img src="https://i.imgur.com/8F6vF8H.png" alt="Flower Decor" class="flower flower-top-left">
        <img src="https://i.imgur.com/8F6vF8H.png" alt="Flower Decor" class="flower flower-bottom-right">

        <!-- Üst Naxış -->
        <img src="https://i.imgur.com/W2C0N0u.png" alt="Ornament" class="top-ornament">

        <!-- Başlıq -->
        <h1 class="title">Dəvətlisiniz</h1>

        <!-- İsim -->
        <div class="name">Elza Vəlizadə</div>

        <!-- Təhsil Məlumatı -->
        <div class="details">BMU - Biotexnologiya 2026</div>

        <!-- Tarix -->
        <div class="date-box">
            <div class="day-name">Çərşənbə</div>
            <div class="day-number">01</div>
            <div class="month-year">sentyabr<br>2026</div>
        </div>

        <!-- Məkan -->
        <div class="venue">
            Ankara restoran
        </div>

        <!-- RSVP Düyməsi -->
        <a href="https://wa.me/994XXXXXXXXX?text=Mən%20gəlirəm!" class="btn-rsvp">Qəbul Et</a>
    </div>

    <script>
        // Səhifə yükləndikdə yüngül bir parıltı effekti əlavə edirik
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('.invitation-card');
            
            // Kartın üzərinə gəldikdə yaranan animasiya (CSS ilə də edilə bilərdi, amma JS istədiyin üçün bura əlavə etdim)
            card.addEventListener('mouseover', () => {
                card.style.boxShadow = '0 15px 40px rgba(179, 139, 93, 0.2)';
            });

            card.addEventListener('mouseout', () => {
                card.style.boxShadow = '0 10px 30px rgba(0,0,0,0.1)';
            });
        });
    </script>
</body>
</html>

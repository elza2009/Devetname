<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dəvətnamə | Elza Vəlizadə</title>
    <!-- Google Fonts & FontAwesome İkonları -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Şəkilsiz - Krem rəngi və zərli/qızılı parıltı effekti */
            background: radial-gradient(circle at center, #fffdf8 0%, #f7efe2 50%, #eae0d0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Playfair Display', serif;
            color: #1a1a1a;
            overflow-x: hidden;
            position: relative;
        }

        /* Zərli parıltı fakturası (CSS effekti) */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(#d4af37 0.75px, transparent 0.75px);
            background-size: 24px 24px;
            opacity: 0.18;
            pointer-events: none;
        }

        /* Dəvətnamə Kartı */
        .invitation-card {
            text-align: center;
            padding: 45px 30px;
            max-width: 480px;
            width: 90%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 15px 35px rgba(212, 175, 55, 0.15), 0 5px 15px rgba(0, 0, 0, 0.05);
            animation: floating 4s ease-in-out infinite; 
        }

        /* Elementlərin animasiya ilə gəlməsi */
        .animate-item {
            opacity: 0;
            animation: fadeInUp 1s ease-out forwards;
        }

        /* ANİMASİYA GİRİŞ SIRALAMASI: */
        .delay-1 { animation-delay: 0.2s; } /* 1. Dəvətlisiniz */
        .delay-2 { animation-delay: 0.6s; } /* 2. Məzuniyyət Papağı */
        .delay-3 { animation-delay: 1.0s; } /* 3. Elza Vəlizadə */
        .delay-4 { animation-delay: 1.3s; } /* İxtisas */
        .delay-5 { animation-delay: 1.6s; } /* Tarix və Saat */
        .delay-6 { animation-delay: 1.9s; } /* Məkan & Konum Düyməsi */

        /* Dəvətlisiniz Yazısı */
        h1.title {
            font-family: 'Great Vibes', cursive;
            font-size: 4.5rem;
            font-weight: 400;
            color: #2b2b2b;
            margin-bottom: 5px;
        }

        /* Papaq İkonu */
        .grad-icon {
            font-size: 44px;
            color: #d4af37;
            margin: 10px 0;
            filter: drop-shadow(0 2px 4px rgba(212, 175, 55, 0.3));
        }

        /* Ad Soyad */
        h2.name {
            font-family: 'Great Vibes', cursive;
            font-size: 3.8rem;
            font-weight: 400;
            margin: 10px 0;
            color: #1a1a1a;
        }

        h3.university {
            font-size: 1.3rem;
            font-style: italic;
            margin: 15px 0;
            font-weight: 400;
            color: #4a4a4a;
        }

        /* Zərli separator xətti */
        .separator {
            font-size: 18px;
            margin: 10px 0;
            color: #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .separator::before, .separator::after {
            content: '';
            width: 50px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin: 0 10px;
        }

        /* Yenilənmiş Tarix və Saat Bloku */
        .event-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            padding: 15px;
            border-top: 1px dashed rgba(212, 175, 55, 0.4);
            border-bottom: 1px dashed rgba(212, 175, 55, 0.4);
        }

        .date-badge {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .date-num {
            font-size: 2.8rem;
            font-weight: 600;
            color: #d4af37;
            line-height: 1;
        }

        .date-details {
            text-align: left;
            font-size: 1.1rem;
            line-height: 1.3;
        }

        /* Saat Qutusu */
        .time-badge {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            background: rgba(212, 175, 55, 0.15);
            padding: 6px 20px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .location-text {
            font-size: 1.35rem;
            margin-top: 15px;
            margin-bottom: 25px;
            font-weight: 600;
            color: #2b2b2b;
        }

        /* Google Maps Düyməsi */
        .location-btn {
            display: inline-block;
            background: linear-gradient(135deg, #d4af37 0%, #aa820a 100%);
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-family: 'Playfair Display', serif;
            font-size: 1.05rem;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
            animation: pulseBtn 2s infinite;
        }

        .location-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.6);
        }

        .location-btn i {
            margin-right: 8px;
        }

        /* Keyframe Animasiyaları */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(35px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        @keyframes pulseBtn {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        @media (max-width: 480px) {
            h1.title { font-size: 3.8rem; }
            h2.name { font-size: 3.2rem; }
            h3.university { font-size: 1.15rem; }
            .date-num { font-size: 2.3rem; }
        }
    </style>
</head>
<body>

    <div class="invitation-card">
        
        <!-- 1. DƏVƏTLİSİNİZ (İLK GƏLİR) -->
        <h1 class="title animate-item delay-1">Dəvətlisiniz</h1>

        <!-- 2. PAPAQ İKONU (İKİNCİ GƏLİR) -->
        <div class="animate-item delay-2">
            <i class="fa-solid fa-graduation-cap grad-icon"></i>
        </div>

        <!-- 3. ELZA VƏLİZADƏ (ÜÇÜNCÜ GƏLİR) -->
        <h2 class="name animate-item delay-3">Elza Vəlizadə</h2>

        <!-- İxtisas -->
        <div class="separator animate-item delay-4">
            <i class="fa-solid fa-star" style="font-size: 10px;"></i>
        </div>
        <h3 class="university animate-item delay-4">BMU-Biotexnologiya 2026</h3>

        <!-- Tarix və Saat (Yenilənmiş dizayn) -->
        <div class="event-info animate-item delay-5">
            <div class="date-badge">
                <span class="date-num">01</span>
                <div class="date-details">
                    <div><b>Sentyabr 2026</b></div>
                    <div style="color: #666; font-size: 0.95rem;">Çərşənbə günü</div>
                </div>
            </div>
            
            <!-- Əlavə olunmuş Saat -->
            <div class="time-badge">
                <i class="fa-regular fa-clock"></i> Saat: 18:00
            </div>
        </div>

        <!-- Məkan və Konum -->
        <div class="location-text animate-item delay-6">Ankara restoran</div>

        <div class="animate-item delay-6">
            <a href="https://maps.app.goo.gl/X5Ag81YLk1cgCfdX7?g_st=ic" target="_blank" class="location-btn">
                <i class="fa-solid fa-location-dot"></i> Məkanın Konumu
            </a>
        </div>

    </div>

</body>
</html>
